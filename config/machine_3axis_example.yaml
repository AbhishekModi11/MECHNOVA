schema_version: "1.0.0"

machine:
  id: "VMC-3AXIS-STD"
  name: "Standard 3-Axis Vertical Machining Center"
  axes: 3
  indexed_3plus2: true
  travel_limits_mm:
    x_min: -300.0
    x_max: 300.0
    y_min: -200.0
    y_max: 200.0
    z_min: -150.0
    z_max: 150.0
  max_spindle_rpm: 12000.0
  max_feed_mm_min: 5000.0
  rapid_rate_mm_min: 10000.0
  tool_changer_capacity: 20
  tool_change_time_s: 8.0
  setup_change_time_s: 300.0
  controller_flavor: "fanuc"  # Options: fanuc, haas, linuxcnc
  allowed_setup_orientations:
    - [0, 0, 1]    # Top (+Z)
    - [0, 0, -1]   # Bottom (-Z)
    - [1, 0, 0]    # Right (+X)
    - [-1, 0, 0]   # Left (-X)
    - [0, 1, 0]    # Back (+Y)
    - [0, -1, 0]   # Front (-Y)
  workholding_assumption: "Standard precision machine vise clamping bottom 5mm of stock."
